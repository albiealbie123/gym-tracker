<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Tracker</title>
<meta name="theme-color" content="#121416">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<script>window.GYM_MODE = "pwa";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout idea: one narrow column built around a single set card — the weight is a scoreboard numeral, workouts are bumper plates. */
:root {
  --bg: #121416; --surface: #1b1e22; --surface-2: #252a30; --ink: #eef1f4; --muted: #9aa3ad; --line: #2e343b;
  --accent: #f0a93a; --on-accent: #1a1206;
  --good: #3ecf8e; --warn: #f5b942; --danger: #ff6b6b;
  --f-display: "Big Shoulders Display", "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --nav-h: 64px;
  color-scheme: dark;
}
:root[data-skin="iron"]     { --bg:#121416; --surface:#1b1e22; --surface-2:#252a30; --ink:#eef1f4; --muted:#9aa3ad; --line:#2e343b; --accent:#f0a93a; --on-accent:#1a1206; }
:root[data-skin="red25"]    { --bg:#140f10; --surface:#1f1718; --surface-2:#2b2022; --ink:#f7eeee; --muted:#b59fa1; --line:#3b2c2e; --accent:#ff5a52; --on-accent:#1d0604; }
:root[data-skin="blue20"]   { --bg:#0b111e; --surface:#121a2c; --surface-2:#1a253e; --ink:#eaf0ff; --muted:#95a4c6; --line:#26324e; --accent:#4f8dff; --on-accent:#03102b; }
:root[data-skin="yellow15"] { --bg:#0f0f0b; --surface:#1a1a14; --surface-2:#25251c; --ink:#f8f6e8; --muted:#b5b29b; --line:#34332a; --accent:#ffd23f; --on-accent:#1c1800; }
:root[data-skin="green10"]  { --bg:#0c1410; --surface:#132019; --surface-2:#1b2c22; --ink:#eaf5ee; --muted:#94ad9d; --line:#284133; --accent:#3ddc84; --on-accent:#03170b; }
:root[data-skin="amoled"]   { --bg:#000000; --surface:#0d0d10; --surface-2:#18181c; --ink:#f2f2f5; --muted:#8f8f98; --line:#232328; --accent:#b28cff; --on-accent:#14062e; }
:root[data-skin="ocean"]    { --bg:#08161a; --surface:#0e2227; --surface-2:#153038; --ink:#e6f6f7; --muted:#8fb4b9; --line:#1f3e46; --accent:#2fd4d0; --on-accent:#002523; }
:root[data-skin="plum"]     { --bg:#170f17; --surface:#221722; --surface-2:#2e1f2e; --ink:#f7ecf5; --muted:#b69cb2; --line:#3d2b3c; --accent:#ff7eb6; --on-accent:#2a0718; }
:root[data-skin="chalk"]    { --bg:#f1f2f4; --surface:#ffffff; --surface-2:#e6e8ec; --ink:#15181c; --muted:#5a626d; --line:#d3d7dd; --accent:#2350d8; --on-accent:#ffffff; --good:#13804f; --warn:#a66a00; --danger:#c62828; color-scheme: light; }
:root[data-skin="steel"]    { --bg:#e7edf0; --surface:#f8fafb; --surface-2:#d9e2e7; --ink:#0f1f29; --muted:#4b606d; --line:#c3d0d7; --accent:#0d8579; --on-accent:#ffffff; --good:#13804f; --warn:#a66a00; --danger:#c62828; color-scheme: light; }
:root[data-skin="daylight"] { --bg:#fafafa; --surface:#ffffff; --surface-2:#eeeeee; --ink:#111111; --muted:#555555; --line:#dcdcdc; --accent:#d7262d; --on-accent:#ffffff; --good:#13804f; --warn:#a66a00; --danger:#b71c1c; color-scheme: light; }
:root[data-skin="lilac"]    { --bg:#f3f1fa; --surface:#ffffff; --surface-2:#e7e3f5; --ink:#1b1630; --muted:#5e5779; --line:#d7d1ec; --accent:#6a4be4; --on-accent:#ffffff; --good:#13804f; --warn:#a66a00; --danger:#c62828; color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.num, .tab-num { font-variant-numeric: tabular-nums; }

/* ---------- frame ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--on-accent) 30%, transparent), inset 0 0 0 9px var(--accent), inset 0 0 0 10px color-mix(in srgb, var(--on-accent) 35%, transparent); }
.sync { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="synced"] i { background: var(--good); }
.sync[data-s="saving"] i, .sync[data-s="connecting"] i { background: var(--warn); }
.sync[data-s="offline"] i, .sync[data-s="error"] i { background: var(--danger); }

main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 96px); }
.screen { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: var(--nav-h);
  display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line);
}
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: var(--muted); min-height: 48px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"] svg { stroke: var(--accent); }

/* ---------- type ---------- */
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.h-display { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
.h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; }
.h3 { font-size: 18px; font-weight: 700; line-height: 1.25; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.section-title { font-family: var(--f-display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 6px; }

/* ---------- cards & buttons ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; min-width: 0; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
  border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; text-align: center;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); background: transparent; border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.btn.xl { min-height: 60px; font-size: 20px; width: 100%; border-radius: 16px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.back { align-self: flex-start; border: 0; background: none; color: var(--muted); font-weight: 700; padding: 8px 0; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.linkish { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 10px 0; min-height: 44px; text-align: left; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.accent { background: var(--accent); color: var(--on-accent); }
.tag.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.tag.danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }

/* bumper-plate badge */
.plate {
  --pc: var(--accent); --pt: var(--on-accent);
  flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  background: var(--pc); color: var(--pt); font-family: var(--f-display); font-weight: 800; font-size: 27px; line-height: 1;
  box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--pt) 22%, transparent), inset 0 0 0 9px var(--pc), inset 0 0 0 10px color-mix(in srgb, var(--pt) 30%, transparent);
}
.plate.k-B { --pc: var(--ink); --pt: var(--bg); }
.plate.k-extra, .plate.k-legacy { --pc: var(--surface-2); --pt: var(--ink); font-size: 18px; }
.plate.lg { width: 64px; height: 64px; font-size: 34px; }
.plate.sm { width: 40px; height: 40px; font-size: 21px; }

/* ---------- home ---------- */
.last { display: flex; gap: 14px; align-items: center; }
.last .big { font-size: 20px; font-weight: 700; line-height: 1.2; }
.choices { display: grid; gap: 12px; }
.choice {
  display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; padding: 16px; border-radius: var(--r-lg);
  border: 2px solid var(--line); background: var(--surface);
}
.choice.is-next { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.choice-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.choice-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; }
.choice-meta { font-weight: 700; }
.choice-list { color: var(--muted); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 30px; line-height: 1; font-weight: 800; }
.stat span { font-size: 13px; color: var(--muted); }

/* ---------- plan ---------- */
.plan-head { display: flex; gap: 14px; align-items: center; }
.plan-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: ex; }
.pe { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: grid; gap: 10px; }
.pe.skipped { opacity: .55; }
.pe.skipped .pe-sets { display: none; }
.pe-top { display: flex; gap: 10px; align-items: flex-start; }
.pe-num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.pe-name { font-weight: 700; font-size: 18px; line-height: 1.25; }
.basis { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.pe-sets { display: grid; gap: 4px; }
.pset { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 15px; }
.pset .w { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1; }
.pset .w small { font-family: var(--f-body); font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 3px; }
.pset .note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.why { font-size: 14px; color: var(--muted); }
.why b { color: var(--ink); }
.pe-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 700; }
.sticky-cta { position: sticky; bottom: calc(var(--nav-h) + 10px); z-index: 10; padding-top: 6px; }
.sticky-cta .btn { box-shadow: 0 10px 30px color-mix(in srgb, var(--bg) 80%, transparent); }

/* ---------- workout ---------- */
.wk-progress { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.wk-progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.wk-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); font-weight: 700; margin-top: 8px; }

.rest { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.rest .rest-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.rest .rest-t { font-family: var(--f-display); font-size: 30px; font-weight: 800; line-height: 1; }
.rest .rest-t small { font-family: var(--f-body); font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 8px; text-transform: uppercase; letter-spacing: .05em; }
.rest.over { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.rest.over small { color: var(--on-accent); }
.rest .chip-btn { border-color: currentColor; }

.setcard { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px 16px; display: grid; gap: 14px; }
.ex-kicker { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
.ex-name { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: .98; text-transform: uppercase; letter-spacing: .01em; }
.ex-setup { font-size: 14px; color: var(--muted); }
.setline { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.set-label { font-weight: 700; font-size: 18px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); }
.dots i.done { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--on-accent) 25%, transparent); }
.dots i.cur { border-color: var(--accent); }
.target { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: end; padding: 14px; border-radius: var(--r-md); background: var(--surface-2); }
.big-w { font-family: var(--f-display); font-weight: 800; font-size: 84px; line-height: .82; letter-spacing: -.01em; }
.big-w small { font-family: var(--f-body); font-size: 16px; font-weight: 700; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.big-w.unknown { font-size: 44px; line-height: 1; }
.target-side { display: grid; gap: 2px; padding-bottom: 4px; min-width: 0; }
.target-reps { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; }
.target-reps small, .target-rir small { font-family: var(--f-body); font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.target-rir { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.1; }
.target .basis-line { grid-column: 1 / -1; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.coach { display: grid; gap: 6px; font-size: 15px; }
.coach .aim { font-weight: 700; color: var(--accent); }
.coach .why-now { color: var(--ink); }
.coach .lastline { color: var(--muted); }

.field { display: grid; gap: 8px; }
.field > label, .field > .lbl { font-weight: 700; font-size: 15px; }
.field .lbl-sub { font-weight: 400; color: var(--muted); }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; }
.stepper button { min-height: 60px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); font-size: 22px; font-weight: 800; }
.stepper button.w-step { font-size: 15px; }
.stepper input {
  width: 100%; min-width: 0; min-height: 60px; text-align: center; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--bg);
  font-family: var(--f-display); font-weight: 800; font-size: 34px;
}
.stepper input::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.stepper input:focus { border-color: var(--accent); outline: none; }
.stepper input.err { border-color: var(--danger); }
.err-msg { color: var(--danger); font-size: 14px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.fit { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 6px; }
.chips.fit button { min-width: 0; padding: 0; }
#logform { display: grid; gap: 18px; }
.chips button { min-width: 48px; min-height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 17px; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.ex-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ex-actions button { min-height: 48px; border-radius: var(--r-md); border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 14px; padding: 4px 6px; line-height: 1.15; }

.logged { display: grid; gap: 6px; }
.lset { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); border: 0; text-align: left; width: 100%; min-height: 48px; }
.lset .n { color: var(--muted); font-size: 14px; font-weight: 700; }
.lset .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.lset .x { color: var(--muted); font-size: 13px; }
.lset.edited .v::after { content: " · edited"; color: var(--muted); font-weight: 400; font-size: 13px; }

.queue { display: grid; gap: 8px; }
.q { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 12px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.q.cur { border-color: var(--accent); }
.q.done { opacity: .7; }
.q.skipped { opacity: .5; }
.q .qn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface-2); }
.q.done .qn { background: var(--good); color: var(--bg); }
.q .qt { font-weight: 700; line-height: 1.2; }
.q .qs { font-size: 13px; color: var(--muted); }
.alldone { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 26px 16px; }

/* ---------- history / exercises ---------- */
.list { display: grid; gap: 10px; }
.item { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); min-height: 64px; }
.item .t { font-weight: 700; line-height: 1.25; }
.item .s { font-size: 14px; color: var(--muted); }
.item .chev { color: var(--muted); font-size: 22px; flex: none; }
.month { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.ex-block { display: grid; gap: 8px; }
.ex-block-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.note { font-size: 14px; color: var(--muted); padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv .stat b { font-size: 26px; }
.spark { width: 100%; height: auto; display: block; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.spark .ar { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
.spark .gd { stroke: var(--line); stroke-width: 1; }
.spark text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.spark circle { fill: var(--accent); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.input { width: 100%; min-width: 0; min-height: 48px; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); font-size: 17px; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: none; }

.pg { display: grid; gap: 10px; padding: 14px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.pg-fields { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 8px; }
.pg-fields label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: grid; gap: 4px; }
.mini-step { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); min-height: 48px; }
.mini-step button { border: 0; background: none; font-size: 20px; font-weight: 800; min-height: 46px; }
.mini-step span { text-align: center; font-weight: 800; font-size: 18px; color: var(--ink); }

/* ---------- settings ---------- */
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.theme {
  border-radius: var(--r-md); border: 2px solid var(--line); padding: 0; overflow: hidden; background: none; text-align: left; min-height: 84px;
  display: grid; grid-template-rows: 1fr auto;
}
.theme[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.theme .sw { display: flex; align-items: center; gap: 6px; padding: 12px 10px; }
.theme .sw i { width: 22px; height: 22px; border-radius: 50%; }
.theme .sw b { flex: 1; height: 8px; border-radius: 4px; opacity: .5; }
.theme .nm { padding: 6px 10px 8px; font-size: 13px; font-weight: 700; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 56px; width: 100%; border-left: 0; border-right: 0; border-top: 0; background: none; text-align: left; }
.toggle:last-child { border-bottom: 0; }
.switch { flex: none; width: 52px; height: 30px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); position: relative; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .2s ease; }
.toggle[aria-checked="true"] .switch { background: var(--accent); border-color: transparent; }
.toggle[aria-checked="true"] .switch::after { transform: translateX(22px); background: var(--on-accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row .btn { flex: 1 1 140px; }

/* ---------- sheet dialog & toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-height: 86vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 24px 24px 0 0; border-top: 1px solid var(--line); padding: 10px 16px 24px;
  max-width: 600px; margin: 0 auto; display: grid; gap: 14px;
}
.sheet::before { content: ""; justify-self: center; width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet .pick { display: grid; gap: 8px; }
.toast {
  position: fixed; left: 12px; right: 12px; bottom: calc(var(--nav-h) + 12px); z-index: 40; max-width: 536px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--ink); color: var(--bg); font-weight: 700; font-size: 15px;
  box-shadow: 0 12px 30px rgba(0,0,0,.35);
}
.toast span { flex: 1; min-width: 0; }
.toast button { border: 0; background: none; color: var(--bg); font-weight: 800; text-decoration: underline; min-height: 40px; padding: 0 6px; }

@media (max-width: 360px) {
  .big-w { font-size: 70px; }
  .ex-name { font-size: 30px; }
  .themes { grid-template-columns: repeat(2, 1fr); }
  .pg-fields { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

<script>
/* Gym Tracker — pure logic: catalog, program, progression engine, rotation. No DOM. */
(function (root) {
  'use strict';

  // ---------- Exercise catalog (one entry per machine/setup) ----------
  // inc = smallest practical weight step on that machine (editable in the app)
  // rest = default rest in seconds
  const VARIANTS = {
    d1_incline_usual: { name: 'D1 Incline Chest Press', basis: 'kg', inc: 4.5, rest: 150, muscle: 'Upper chest', setup: 'Usual incline setup. Keep the same seat, grip and setup each time.' },
    v_squat_usual: { name: 'V-Squat', basis: 'kg', inc: 5, rest: 150, muscle: 'Quads & glutes', setup: 'Your hack-squat replacement. Keep stance and depth the same.' },
    seated_leg_curl_usual: { name: 'Seated Leg Curl', basis: 'kg', inc: 4.5, rest: 105, muscle: 'Hamstrings', setup: 'Usual machine. Range is 8–12 since Nov 4 (the original written program said 10–15).' },
    egym_chest_press: { name: 'EGYM Chest Press', basis: 'kg', inc: 5, rest: 150, muscle: 'Chest', setup: 'Flat-press slot. Separate from D1 and from the iso-lateral bench.' },
    iso_lateral_bench: { name: 'Iso-Lateral Bench Press', basis: 'kg per side', inc: 2.5, rest: 150, muscle: 'Chest', setup: 'Plates per side (you confirmed this on Nov 6).' },
    flat_dumbbell_press_new_variant: { name: 'Flat Dumbbell Press', basis: 'kg per hand', inc: 2, rest: 150, muscle: 'Chest', setup: 'Calibrate separately from the machine presses.' },
    incline_dumbbell_press_new_variant: { name: 'Incline Dumbbell Press', basis: 'kg per hand', inc: 2, rest: 150, muscle: 'Upper chest', setup: 'Calibrate separately from D1.' },
    booty_builder_banded: { name: 'Booty Builder', basis: 'kg plates + 2 bands', inc: 5, rest: 150, muscle: 'Glutes', setup: 'Two bands, each rated 20–23 kg. The bands are not added to the kg.' },
    overhead_cable_triceps: { name: 'Overhead Cable Triceps', basis: 'kg', inc: 2.4, rest: 105, muscle: 'Triceps', setup: 'Overhead extension (not pushdowns).' },
    leg_press_calf: { name: 'Leg Press Calf Raise', basis: 'kg', inc: 4.5, rest: 105, muscle: 'Calves', setup: 'On the leg press machine.' },
    v_squat_calf: { name: 'V-Squat Calf Raise', basis: 'kg', inc: 5, rest: 105, muscle: 'Calves', setup: 'Different from leg-press calves; its weights are tracked separately.' },
    standing_calf_raise_new_variant: { name: 'Standing Calf Raise', basis: 'kg', inc: 5, rest: 105, muscle: 'Calves', setup: 'Tracked separately from the other calf machines.' },
    cable_lateral_usual: { name: 'Cable Lateral Raise', basis: 'kg per arm', inc: 2.3, rest: 90, muscle: 'Side delts', setup: 'Do both arms; the pair counts as one set.' },
    hip_adduction_usual: { name: 'Hip Adduction', basis: 'kg', inc: 4.5, rest: 90, muscle: 'Inner thighs', setup: 'Usual machine.' },
    hip_abduction_usual: { name: 'Hip Abduction', basis: 'kg', inc: 4.5, rest: 90, muscle: 'Outer hips', setup: 'Usual machine.' },
    hammer_strength_abs: { name: 'Hammer Strength Abs', basis: 'kg plates', inc: 2.5, rest: 90, muscle: 'Abs', setup: 'Plate-loaded. The kg is the plates you load.' },
    egym_pulldown: { name: 'EGYM Pulldown', basis: 'kg', inc: 5, rest: 150, muscle: 'Lats', setup: 'Separate from other pulldown machines.' },
    iso_lateral_row: { name: 'Iso-Lateral Row', basis: 'kg per arm', inc: 2.5, rest: 150, muscle: 'Upper back', setup: 'Chest-supported. Plates per arm.' },
    leg_extension_usual: { name: 'Leg Extension', basis: 'kg', inc: 4.5, rest: 105, muscle: 'Quads', setup: 'Usual machine.' },
    rear_delt_usual: { name: 'Rear-Delt Machine', basis: 'kg', inc: 4.5, rest: 90, muscle: 'Rear delts', setup: 'Usual setup.' },
    egym_biceps_curl: { name: 'EGYM Biceps Curl', basis: 'kg', inc: 5, rest: 105, muscle: 'Biceps', setup: 'Your current biceps choice.' },
    preacher_curl_new_variant: { name: 'Preacher Curl', basis: 'kg', inc: 2.5, rest: 105, muscle: 'Biceps', setup: 'Tracked separately from the EGYM curl.' },
    b3_back_extension: { name: 'B3 Back Extension', basis: 'kg', inc: 4.5, rest: 105, muscle: 'Lower back', setup: 'Back-extension machine: lower-back work.' },
    straight_arm_cable_pulldown_legacy: { name: 'Straight-Arm Cable Pulldown', basis: 'kg', inc: 2.3, rest: 105, muscle: 'Lats', setup: 'From your older split.', legacy: true },
    one_arm_cable_curl_legacy: { name: 'One-Arm Cable Curl', basis: 'kg per arm', inc: 2.3, rest: 90, muscle: 'Biceps', setup: 'From your older split.', legacy: true }
  };

  const COMPOUND_REST = 150;

  function ex(v, sets, lo, hi, rir, alts) { return { v, sets, lo, hi, rir, alts: alts || [] }; }

  function defaultProgram() {
    return {
      version: 1,
      name: 'A/B split (from handover, 6 Nov 2026)',
      days: {
        A: [
          ex('d1_incline_usual', 3, 8, 12, [2, 1, 1], ['incline_dumbbell_press_new_variant']),
          ex('v_squat_usual', 3, 8, 12, [2, 2, 1]),
          ex('seated_leg_curl_usual', 2, 8, 12, [2, 1]),
          ex('egym_chest_press', 2, 8, 12, [2, 1], ['iso_lateral_bench', 'flat_dumbbell_press_new_variant']),
          ex('booty_builder_banded', 2, 8, 12, [2, 1]),
          ex('overhead_cable_triceps', 3, 10, 15, [2, 1, 1]),
          ex('leg_press_calf', 3, 10, 15, [2, 1, 1], ['v_squat_calf', 'standing_calf_raise_new_variant']),
          ex('cable_lateral_usual', 3, 10, 15, [2, 1, 1]),
          ex('hip_adduction_usual', 2, 10, 15, [2, 1]),
          ex('hammer_strength_abs', 2, 10, 15, [2, 1])
        ],
        B: [
          ex('egym_pulldown', 3, 8, 12, [2, 1, 1]),
          ex('iso_lateral_row', 3, 8, 12, [2, 1, 1]),
          ex('seated_leg_curl_usual', 2, 8, 12, [2, 1]),
          ex('leg_extension_usual', 2, 10, 15, [2, 1]),
          ex('rear_delt_usual', 3, 8, 12, [2, 1, 1]),
          ex('egym_biceps_curl', 3, 8, 12, [2, 1, 1], ['preacher_curl_new_variant']),
          ex('cable_lateral_usual', 2, 10, 15, [2, 1]),
          ex('b3_back_extension', 2, 10, 15, [2, 2]),
          ex('hip_abduction_usual', 2, 10, 15, [2, 1]),
          ex('hammer_strength_abs', 2, 10, 15, [2, 1])
        ]
      },
      overrides: {},   // per-exercise edits: { inc, rest, setup, name, basis }
      custom: {},      // exercises you add yourself
      // One-off starting loads from the handover where they differ from the rule engine.
      nextLoads: {
        egym_chest_press: { loads: [75, 75], asOf: '2026-11-06', note: 'Starting point from your handover: about 75 kg, then adjust set 2 to how it feels.' }
      }
    };
  }

  // ---------- small helpers ----------
  const r1 = (x) => Math.round(x * 10) / 10;
  function fmtW(w) {
    if (w == null || isNaN(w)) return '—';
    const v = r1(w);
    return (Number.isInteger(v) ? String(v) : v.toFixed(1));
  }
  function fmtReps(r) { return r == null ? '—' : (Number.isInteger(r) ? String(r) : String(r1(r))); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function isoDate(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmtDate(s, long) { const d = parseISO(s); return (long ? DOWL : DOW)[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
  function relDay(s, today) {
    const n = daysBetween(s, today || isoDate());
    if (n === 0) return 'today';
    if (n === 1) return 'yesterday';
    if (n > 1) return n + ' days ago';
    if (n === -1) return 'tomorrow';
    return 'in ' + (-n) + ' days';
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function variantInfo(id, program) {
    const p = program || {};
    const base = VARIANTS[id] || (p.custom || {})[id] || { name: id.replace(/_/g, ' '), basis: 'kg', inc: 2.5, rest: 105, muscle: '', setup: '' };
    const ov = (p.overrides || {})[id] || {};
    return Object.assign({ id }, base, ov);
  }
  function allVariantIds(program) {
    return Object.keys(VARIANTS).concat(Object.keys((program && program.custom) || {}));
  }

  // ---------- history queries ----------
  function liveSessions(sessions) {
    return (sessions || []).filter((s) => s && !s.deleted)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.finishedAt || a.startedAt || 0) - (b.finishedAt || b.startedAt || 0)));
  }
  function loggedSets(e) { return (e.sets || []).filter((s) => s && s.r != null); }
  function countSets(session) { return (session.exercises || []).reduce((n, e) => n + loggedSets(e).length, 0); }

  /** Every session in which this exercise has logged sets, oldest first. */
  function exposures(sessions, vid) {
    const out = [];
    liveSessions(sessions).forEach((s) => {
      const sets = [];
      (s.exercises || []).forEach((e) => { if (e.v === vid) loggedSets(e).forEach((x) => sets.push(x)); });
      if (sets.length) out.push({ date: s.date, kind: s.kind, sessionId: s.id, imported: !!s.imported, sets });
    });
    return out;
  }

  function lastRegular(sessions) {
    const regs = liveSessions(sessions).filter((s) => s.kind === 'A' || s.kind === 'B');
    return regs[regs.length - 1] || null;
  }
  function suggestNext(sessions) {
    const l = lastRegular(sessions);
    if (!l) return 'A';
    return l.kind === 'A' ? 'B' : 'A';
  }

  // ---------- progression engine ----------
  // Reps credited for progression: fractional reps are not rounded up, and an easier target RIR
  // (or a reported actual RIR above target) adds at most 2 reps of "room".
  function effReps(set, targetRir) {
    let r = Math.floor(set.r);
    let bonus = 0;
    if (targetRir != null) {
      if (set.rir != null) bonus = Math.max(0, Math.min(2, set.rir - targetRir));
      else if (set.trir != null) bonus = Math.max(0, Math.min(2, set.trir - targetRir));
    }
    return r + bonus;
  }
  function backoffAmount(w, inc) { return Math.max(inc, Math.round((0.1 * w) / inc) * inc); }
  function lastString(sets) {
    if (!sets || !sets.length) return '';
    const ws = sets.map((s) => s.w);
    const same = ws.every((w) => w === ws[0]);
    if (same) return sets.map((s) => fmtReps(s.r)).join(' / ') + ' × ' + fmtW(ws[0]);
    return sets.map((s) => fmtReps(s.r) + '×' + fmtW(s.w)).join(', ');
  }

  /**
   * Recommend loads for each planned set.
   * plan: {sets, lo, hi, rir:[...]}. Returns {loads[], whys[], aims[], summary, trend, last}.
   * trend: 'up' | 'hold' | 'down' | 'new' | 'plan'
   */
  function recommend(vid, plan, sessions, program) {
    const info = variantInfo(vid, program);
    const inc = Number(info.inc) || 2.5;
    const n = Math.max(1, plan.sets | 0);
    const tr = (i) => (plan.rir && plan.rir.length ? plan.rir[Math.min(i, plan.rir.length - 1)] : null);
    const exps = exposures(sessions, vid);
    const last = exps[exps.length - 1] || null;
    const out = { loads: new Array(n).fill(null), whys: new Array(n).fill(''), aims: new Array(n).fill(null), summary: '', trend: 'new', last };

    const nl = program && program.nextLoads && program.nextLoads[vid];
    if (nl && nl.loads && nl.loads.length && (!last || last.imported)) {
      for (let i = 0; i < n; i++) out.loads[i] = nl.loads[Math.min(i, nl.loads.length - 1)];
      out.summary = nl.note || 'Planned starting weight.';
      out.trend = 'plan';
      return out;
    }
    if (!last) {
      out.summary = 'New exercise for the app: pick a comfortable weight. Next time it suggests one from what you log today.';
      return out;
    }
    const L = last.sets.filter((s) => s.w != null);
    if (!L.length) { out.summary = 'No weight logged last time: pick one.'; return out; }
    const top = Math.max.apply(null, L.map((s) => s.w));
    const firstN = L.slice(0, n);
    const allTop = L.length >= n && firstN.every((s, i) => s.w === top && effReps(s, tr(i)) >= plan.hi);

    if (allTop) {
      const next = r1(top + inc);
      const pct = Math.round((inc / top) * 100);
      if (inc / top > 0.25) {
        for (let i = 0; i < n; i++) out.loads[i] = i === 0 ? next : top;
        out.whys[0] = 'Trial set: ' + fmtW(next) + ' is +' + pct + '%';
        out.summary = 'All ' + n + ' sets reached ' + plan.hi + '+ at ' + fmtW(top) + '. The next step (' + fmtW(next) + ') is a big jump (+' + pct + '%), so try it on set 1 only.';
      } else {
        for (let i = 0; i < n; i++) { out.loads[i] = next; out.aims[i] = plan.lo; }
        out.summary = 'All ' + n + ' sets reached ' + plan.hi + '+ at ' + fmtW(top) + ' last time, so go up ' + fmtW(inc) + ' kg.';
      }
      out.trend = 'up';
      return out;
    }

    // A heavier weight that fell below the range blocks moving lighter sets up toward it.
    const topFail = L.some((s, i) => s.w === top && effReps(s, tr(i)) < plan.lo);
    // ...and if that heavier weight came after a lighter set, it was a trial that did not work yet.
    const trialIdx = L.findIndex((s, j) => s.w === top && effReps(s, tr(j)) < plan.lo && L.slice(0, j).some((p) => p.w < top));
    const lighter = [];
    let atTop = 0;
    for (let i = 0; i < n; i++) {
      const padded = !L[i];
      const s = L[i] || L[L.length - 1];
      const e = effReps(s, tr(i));
      let w = s.w;
      if (!padded && Math.floor(s.r) >= plan.hi) atTop++;
      if (e < plan.lo) {
        const nw = r1(w - backoffAmount(w, inc));
        if (nw > 0) { w = nw; lighter.push(i); out.whys[i] = (padded ? 'Last set' : 'Set ' + (i + 1)) + ' was ' + fmtReps(s.r) + ' reps at ' + fmtW(s.w) + ', so lighter'; }
      } else if (e >= plan.hi && w < top && !topFail) {
        w = r1(Math.min(top, w + inc));
        out.whys[i] = 'Hit ' + fmtReps(s.r) + ' at ' + fmtW(s.w) + ', so move up';
      } else if (!padded) {
        const aim = Math.min(plan.hi, Math.max(plan.lo, Math.floor(s.r) + 1));
        out.aims[i] = aim;
      }
      out.loads[i] = w;
    }
    const lastTxt = lastString(L);
    if (trialIdx >= 0) {
      out.trend = 'hold';
      out.summary = 'Your ' + fmtW(top) + ' try gave ' + fmtReps(L[trialIdx].r) + ' reps (below ' + plan.lo + '), so stay at ' + fmtW(Math.max.apply(null, out.loads)) + ' and build reps (' + lastTxt + ').';
    } else if (lighter[0] === 0) {
      out.trend = 'down';
      out.summary = 'Set 1 was below ' + plan.lo + ' reps last time (' + lastTxt + '), so start a bit lighter.';
    } else if (lighter.length) {
      out.trend = 'hold';
      out.summary = 'Keep ' + fmtW(top) + ' and add reps. Lighter set ' + lighter.map((i) => i + 1).join(' & ') + ' because it dropped below ' + plan.lo + ' (' + lastTxt + ').';
    } else if (atTop > 0) {
      out.trend = 'hold';
      out.summary = atTop + ' of ' + n + ' sets reached ' + plan.hi + '+ (' + lastTxt + '). The weight goes up once every set gets there.';
    } else {
      out.trend = 'hold';
      out.summary = 'Same weight, beat your reps (' + lastTxt + '). Up once every set reaches ' + plan.hi + '.';
    }
    if (L.length < n) out.summary += ' Last time had only ' + L.length + ' set' + (L.length > 1 ? 's' : '') + '.';
    return out;
  }

  /**
   * After a set is logged during a workout, adjust the remaining sets of that exercise.
   * ex: workout exercise {sets, lo, hi, recs:[{w, why, aim}], logged:[...]}. i = index of the set just logged.
   */
  function adjustAfterSet(ex, i, set, info) {
    const inc = Number(info.inc) || 2.5;
    const rec = ex.recs[i] && ex.recs[i].w;
    if (set.w == null) return;
    // 1) you chose a different weight: the rest of the sets follow your choice
    if (rec != null && set.w !== rec) {
      const delta = r1(set.w - rec);

  }
  async function persistStorage() {
    try { if (navigator.storage && navigator.storage.persist) ui.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch (e) { /* ignore */ }
  }
  function downloadText(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }
  function markBackup() { saveSettings({ lastBackupAt: Date.now() }); renderSync(); }
  const backupName = () => 'gym-tracker-backup-' + L.isoDate() + '.json';

  // ---------- Home ----------
  function viewHome() {
    const ss = sessions(); const prog = program(); const today = L.isoDate();
    const last = L.lastRegular(ss); const next = L.suggestNext(ss);
    let lastHtml;
    if (last) {
      const miss = missingSets(last);
      lastHtml = '<article class="card last"><span class="plate lg k-' + last.kind + '">' + last.kind + '</span><div class="grow">' +
        '<p class="eyebrow">Last workout</p><p class="big">Workout ' + last.kind + ' · ' + L.fmtDate(last.date) + '</p>' +
        '<p class="muted">' + cap(L.relDay(last.date, today)) + ' · ' + L.countSets(last) + ' sets' + (miss ? ' · ' + miss + ' planned sets not done' : '') + '</p></div></article>';
    } else if ((store.sync === 'connecting' || (store.db && !store.loadedRemote)) && !ss.length) {
      lastHtml = '<article class="card"><p class="h3">Loading your workouts…</p><p class="muted small">Getting your history from your Claude account.</p></article>';
    } else if (PWA) {
      lastHtml = '<article class="card" style="display:grid;gap:10px"><p class="h3">Bring your workout history</p>' +
        '<p class="small muted">Open your history file (gym-tracker-history.json) or any backup. Your last workout and all the suggested weights come from it. Or just pick A or B below to start fresh.</p>' +
        '<label class="btn primary block" for="imp-file-home">Choose history file</label><input id="imp-file-home" type="file" accept=".json,.txt,application/json,text/plain" hidden></article>';
    } else {
      lastHtml = '<article class="card"><p class="h3">No workouts yet</p><p class="muted small">Pick A or B below to start your first one.</p></article>';
    }
    const extras = ss.filter((s) => s.kind === 'extra' && last && s.date >= last.date && (s.finishedAt || 0) > (last.finishedAt || 0));
    const extraNote = extras.length ? '<p class="note">Extra session on ' + L.fmtDate(extras[extras.length - 1].date) + '. Extra sessions don\'t change the A/B order.</p>' : '';

    const choice = (k) => {
      const day = prog.days[k] || [];
      const sets = day.reduce((n, e) => n + e.sets, 0);
      const mins = L.estimateMinutes(L.buildWorkout(k, prog, ss, today));
      const isNext = k === next;
      return '<button class="choice' + (isNext ? ' is-next' : '') + '" data-act="choose" data-kind="' + k + '">' +
        '<span class="plate lg k-' + k + '">' + k + '</span><span class="choice-body">' +
        '<span class="choice-title">Workout ' + k + (isNext ? ' <span class="tag accent">Up next</span>' : '') + '</span>' +
        '<span class="choice-meta">' + day.length + ' exercises · ' + sets + ' sets · about ' + mins + ' min</span>' +
        '<span class="choice-list">' + day.map((e) => esc(info(e.v, prog).name)).join(' · ') + '</span></span></button>';
    };

    const since7 = L.isoDate(new Date(Date.now() - 6 * 86400000));
    const recent = ss.filter((s) => s.date >= since7);
    const daysSince = last ? L.daysBetween(last.date, today) : null;
    const dateStr = L.fmtDate(today, true);

    return '<section class="screen home">' +
      '<div><p class="eyebrow">' + dateStr + '</p><h1 class="h-display">' + (last ? 'Workout ' + next + ' is up' : 'Let\'s train') + '</h1></div>' +
      lastHtml + extraNote + installCard() +
      '<h2 class="section-title">Choose today\'s workout</h2>' +
      '<div class="choices">' + choice('A') + choice('B') + '</div>' +
      '<button class="linkish" data-act="choose" data-kind="extra">+ Extra session (doesn\'t change A/B order)</button>' +
      '<div class="stats">' +
      '<div class="stat"><b>' + recent.length + '</b><span>sessions, last 7 days</span></div>' +
      '<div class="stat"><b>' + recent.reduce((n, s) => n + L.countSets(s), 0) + '</b><span>sets, last 7 days</span></div>' +
      '<div class="stat"><b>' + (daysSince == null ? '—' : daysSince) + '</b><span>days since last A/B</span></div>' +
      '</div></section>';
  }

  // ---------- Plan (today's workout before starting) ----------
  function viewPlan() {
    const w = ui.plan; const prog = program();
    const title = w.kind === 'extra' ? 'Extra session' : 'Workout ' + w.kind;
    const items = w.exercises.map((e, i) => {
      const inf = info(e.v, prog);
      const skipped = e.status === 'skipped';
      const sets = e.recs.slice(0, e.sets).map((r, j) =>
        '<div class="pset"><span class="small muted">Set ' + (j + 1) + '</span><span class="w">' + (r.w == null ? '?' : fmtW(r.w)) + '<small>kg</small></span>' +
        '<span class="small muted">' + e.lo + '–' + e.hi + ' reps · RIR ' + rirLabel(rirAt(e, j)) + '</span>' +
        (r.why ? '<span class="note">' + esc(r.why) + '</span>' : '') + '</div>').join('');
      return '<li class="pe' + (skipped ? ' skipped' : '') + '">' +
        '<div class="pe-top"><span class="pe-num">' + (i + 1) + '</span><div class="grow"><div class="pe-name">' + esc(inf.name) + basisTag(inf.basis) + '</div>' +
        '<div class="small muted">' + e.sets + ' × ' + e.lo + '–' + e.hi + (skipped ? ' · skipped today' : '') + '</div></div>' + trendTag(e.trend, e) + '</div>' +
        '<div class="pe-sets">' + sets + '</div>' +
        (skipped ? '' : '<p class="why">' + esc(e.summary) + '</p>') +
        '<div class="pe-actions">' +
        '<button class="chip-btn" data-act="plan-move" data-k="' + e.key + '" data-d="-1" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>↑ Up</button>' +
        '<button class="chip-btn" data-act="plan-move" data-k="' + e.key + '" data-d="1" aria-label="Move down"' + (i === w.exercises.length - 1 ? ' disabled' : '') + '>↓ Down</button>' +
        '<button class="chip-btn" data-act="plan-swap" data-k="' + e.key + '">Swap machine</button>' +
        '<button class="chip-btn" data-act="plan-skip" data-k="' + e.key + '">' + (skipped ? 'Restore' : 'Skip today') + '</button>' +
        '</div></li>';
    }).join('');
    const pending = L.nextPendingIndex(w, 0) >= 0;
    return '<section class="screen plan">' +
      '<button class="back" data-act="plan-back">‹ Back</button>' +
      '<header class="plan-head"><span class="plate lg k-' + w.kind + '">' + (w.kind === 'extra' ? '+' : w.kind) + '</span><div class="grow">' +
      '<h1 class="h-display">' + title + '</h1><p class="muted">Today · ' + L.fmtDate(w.date) + ' · ' + w.exercises.length + ' exercises · ' + L.plannedCount(w) + ' sets' + (w.exercises.length ? ' · about ' + L.estimateMinutes(w) + ' min' : '') + '</p></div></header>' +
      (w.kind === 'extra' ? '<p class="note">Extra sessions are logged like any other, but they don\'t change whether A or B is next.</p>'
        : '<p class="muted small">Weights come from your last sessions on the same machine. You can reorder, swap or skip now, or change things as you go.</p>') +
      (items ? '<ol class="plan-list">' + items + '</ol>' : '') +
      '<button class="btn block" data-act="plan-add">+ Add exercise</button>' +
      '<div class="sticky-cta"><button class="btn primary xl" data-act="start"' + (pending ? '' : ' disabled') + '>Start ' + title + '</button></div>' +
      '</section>';
  }

  // ---------- Workout (one set at a time) ----------
  function viewWorkout(w) {
    let cur = w.exercises[w.cur];
    if (!cur || L.isExDone(cur)) {
      const nx = L.nextPendingIndex(w, w.cur || 0);
      if (nx >= 0) { w.cur = nx; cur = w.exercises[nx]; } else cur = null;
    }
    const planned = L.plannedCount(w), done = L.doneCount(w);
    const pct = planned ? Math.min(100, Math.round((done / planned) * 100)) : 0;
    const title = w.kind === 'extra' ? 'Extra session' : 'Workout ' + w.kind;
    const top = '<div><div class="wk-progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + planned + '" aria-valuenow="' + done + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="wk-meta"><span>' + title + ' · ' + L.fmtDate(w.date) + '</span><span>' + done + ' of ' + planned + ' sets</span></div></div>';
    const rest = '<div id="rest" class="rest" hidden><div class="rest-t"><span id="rest-time">0:00</span><small id="rest-lbl">Rest</small></div>' +
      '<button class="chip-btn" data-act="rest-add">+30 s</button><button class="chip-btn" data-act="rest-skip">Skip</button><span class="rest-bar" id="rest-bar"></span></div>';
    const card = cur ? setCard(w, cur) : allDoneCard(w, planned, done);
    const loggedHtml = cur && cur.logged.length ? loggedBlock(cur) : '';
    const queue = w.exercises.map((e) => queueItem(e, w, cur)).join('');
    const allDone = !cur;
    return '<section class="screen workout">' + top + rest + card + loggedHtml +
      '<section class="ex-block"><div class="ex-block-h"><h3 class="h3">Today\'s plan</h3><button class="linkish" data-act="add-ex">+ Add exercise</button></div>' +
      '<div class="queue">' + queue + '</div></section>' +
      (allDone ? '' : '<button class="btn block" data-act="finish">Finish workout</button>') +
      '<button class="linkish" data-act="discard" style="color:var(--danger)">Discard this workout</button>' +
      '</section>';
  }

  function setCard(w, e) {
    const inf = info(e.v);
    const i = e.logged.length;
    const rec = recAt(e, i);
    const trir = rirAt(e, i);
    const idx = w.exercises.indexOf(e);
    const dots = Array.from({ length: e.sets }, (_, j) => '<i class="' + (j < i ? 'done' : j === i ? 'cur' : '') + '"></i>').join('');
    const lastSet = e.lastSets && e.lastSets[i];
    const inc = Number(inf.inc) || 2.5;
    const coach = [];
    if (rec.aim) coach.push('<p class="aim">Aim for ' + rec.aim + '+ reps' + (lastSet ? ' (beat ' + fmtR(lastSet.r) + ')' : '') + '</p>');
    else if (rec.w == null) coach.push('<p class="aim">Pick a weight you can lift for ' + e.lo + '–' + e.hi + ' clean reps</p>');
    if (rec.why) coach.push('<p class="why-now">' + esc(rec.why) + '</p>');
    else if (i === 0 && e.summary) coach.push('<p class="why-now">' + esc(e.summary) + '</p>');
    if (lastSet) coach.push('<p class="lastline">Last time (' + L.fmtDate(e.lastDate) + '), set ' + (i + 1) + ': ' + fmtR(lastSet.r) + ' × ' + fmtW(lastSet.w) + ' kg</p>');
    else if (e.lastTxt) coach.push('<p class="lastline">Last time (' + L.fmtDate(e.lastDate) + '): ' + esc(e.lastTxt) + ' kg</p>');
    const chips = []; for (let r = Math.max(1, e.lo - 1); r <= e.hi + 1; r++) chips.push('<button type="button" data-act="rep-chip" data-r="' + r + '" aria-pressed="false">' + r + '</button>');
    const rirChips = [0, 1, 2, 3, 4].map((v) => '<button type="button" data-act="rir" data-v="' + v + '" aria-pressed="' + (ui.rirSel === v) + '">' + rirLabel(v) + '</button>').join('');
    return '<article class="setcard" id="setcard">' +
      '<div class="ex-kicker"><span>Exercise ' + (idx + 1) + ' of ' + w.exercises.length + '</span><span>' + esc(inf.muscle || '') + '</span></div>' +
      '<div><h2 class="ex-name">' + esc(inf.name) + '</h2>' + (inf.setup ? '<p class="ex-setup">' + esc(inf.setup) + '</p>' : '') + '</div>' +
      '<div class="setline"><span class="set-label">Set ' + (i + 1) + ' of ' + e.sets + '</span><span class="dots" aria-hidden="true">' + dots + '</span></div>' +
      '<div class="target">' +
      (rec.w == null ? '<div class="big-w unknown">Your pick</div>' : '<div class="big-w">' + fmtW(rec.w) + '<small>kg</small></div>') +
      '<div class="target-side"><div class="target-reps">' + e.lo + '–' + e.hi + '<small>reps</small></div><div class="target-rir">RIR ' + rirLabel(trir) + '<small>in the tank</small></div></div>' +
      (inf.basis && inf.basis !== 'kg' ? '<div class="basis-line">' + esc(inf.basis) + '</div>' : '') +
      '</div>' +
      '<div class="coach">' + coach.join('') + '</div>' +
      '<form id="logform" autocomplete="off" novalidate>' +
      '<div class="field"><label for="reps">Reps you did</label>' +
      '<div class="stepper"><button type="button" data-act="reps-step" data-d="-1" aria-label="One rep fewer">−</button>' +
      '<input id="reps" name="reps" inputmode="decimal" enterkeyhint="done" placeholder="' + (rec.aim || e.lo) + '" aria-describedby="reps-err">' +
      '<button type="button" data-act="reps-step" data-d="1" aria-label="One rep more">+</button></div>' +
      '<div class="chips fit" style="--n:' + chips.length + '" role="group" aria-label="Quick reps">' + chips.join('') + '</div>' +
      '<p class="err-msg" id="reps-err" hidden></p></div>' +
      '<div class="field"><label for="wt">Weight used <span class="lbl-sub">' + (rec.w == null ? '(kg, needed for a new exercise)' : '· leave empty if you did ' + fmtW(rec.w) + ' kg') + '</span></label>' +
      '<div class="stepper"><button type="button" class="w-step" data-act="w-step" data-d="-1" aria-label="Lighter by ' + fmtW(inc) + ' kg">−' + fmtW(inc) + '</button>' +
      '<input id="wt" name="wt" inputmode="decimal" enterkeyhint="done" placeholder="' + (rec.w == null ? 'kg' : fmtW(rec.w)) + '" aria-describedby="wt-err">' +
      '<button type="button" class="w-step" data-act="w-step" data-d="1" aria-label="Heavier by ' + fmtW(inc) + ' kg">+' + fmtW(inc) + '</button></div>' +
      '<p class="err-msg" id="wt-err" hidden></p></div>' +
      '<div class="field"><span class="lbl">Reps left in the tank <span class="lbl-sub">· optional, target ' + rirLabel(trir) + '</span></span>' +
      '<div class="chips fit" style="--n:5" role="group" aria-label="Reps in reserve">' + rirChips + '</div></div>' +
      '<button type="submit" class="btn primary xl" id="logbtn">Log set ' + (i + 1) + '</button>' +
      '</form>' +
      '<div class="ex-actions">' +
      '<button type="button" data-act="defer">Busy: do later</button>' +
      '<button type="button" data-act="swap">Swap machine</button>' +
      '<button type="button" data-act="skip-ex">' + (i > 0 ? 'End exercise' : 'Skip exercise') + '</button>' +
      '</div></article>';
  }

  function allDoneCard(w, planned, done) {
    return '<article class="setcard alldone"><span class="plate lg k-' + (w.kind === 'B' ? 'B' : 'A') + '">✓</span>' +
      '<h2 class="h2">All sets done</h2><p class="muted">' + done + ' of ' + planned + ' planned sets logged. Tap Finish to save this workout.</p>' +
      '<button class="btn primary xl" data-act="finish">Finish workout</button></article>';
  }

  function loggedBlock(e) {
    return '<section class="ex-block"><div class="ex-block-h"><h3 class="h3">' + esc(info(e.v).name) + ' so far</h3><span class="muted small">Tap a set to fix it</span></div><div class="logged">' +
      e.logged.map((s, j) => '<button class="lset' + (s.orig ? ' edited' : '') + '" data-act="edit-set" data-k="' + e.key + '" data-j="' + j + '"><span class="n">Set ' + (j + 1) + '</span>' +
        '<span class="v">' + fmtR(s.r) + ' × ' + fmtW(s.w) + ' kg</span><span class="x">' + (s.rir != null ? 'RIR ' + rirLabel(s.rir) : 'Edit') + '</span></button>').join('') +
      '</div></section>';
  }

  function queueItem(e, w, cur) {
    const inf = info(e.v);
    const idx = w.exercises.indexOf(e);
    const isCur = cur && e.key === cur.key;
    const done = L.isExDone(e) && e.status !== 'skipped';
    const skipped = e.status === 'skipped';
    let sub, btn = '';
    if (skipped) { sub = 'Skipped'; btn = '<button class="chip-btn" data-act="unskip" data-k="' + e.key + '">Restore</button>'; }
    else if (done) { sub = e.logged.length ? L.lastString(e.logged) + ' kg' + (e.logged.length < e.sets ? ' · ended early' : '') : 'Done'; btn = '<button class="chip-btn" data-act="add-set" data-k="' + e.key + '" aria-label="Add another set">+ Set</button>'; }
    else {
      const left = e.sets - e.logged.length;
      const loads = e.recs.slice(e.logged.length, e.sets).map((r) => (r.w == null ? '?' : fmtW(r.w)));
      sub = (e.logged.length ? e.logged.length + ' done, ' + left + ' to go · ' : e.sets + ' × ' + e.lo + '–' + e.hi + ' · ') + loads.join(' / ') + ' kg' + (e.deferred ? ' · moved (busy)' : '');
      if (!isCur) btn = '<button class="chip-btn" data-act="do-now" data-k="' + e.key + '">Do now</button>';
      else btn = '<span class="tag accent">Now</span>';
    }
    return '<div class="q' + (isCur ? ' cur' : '') + (done ? ' done' : '') + (skipped ? ' skipped' : '') + '">' +
      '<span class="qn">' + (done ? '✓' : idx + 1) + '</span><div class="grow"><div class="qt">' + esc(inf.name) + '</div><div class="qs">' + esc(sub) + '</div></div>' + btn + '</div>';
  }

  // ---------- Summary after finishing ----------
  function viewSummary() {
    const s = store.docs['s-' + ui.summaryId];
    if (!s) { ui.summaryId = null; return viewHome(); }
    const prog = program(); const ss = sessions();
    const mins = s.finishedAt && s.startedAt ? Math.round((s.finishedAt - s.startedAt) / 60000) : null;
    const rows = s.exercises.map((e) => {
      const inf = info(e.v, prog);
      const sets = L.loggedSets(e);
      const tag = e.status === 'skipped' ? '<span class="tag">Skipped</span>' : e.status === 'not done' ? '<span class="tag warn">Not done</span>' : e.status === 'partial' ? '<span class="tag warn">' + sets.length + ' of ' + e.plan.sets + '</span>' : '';
      return '<div class="item" style="min-height:56px"><div class="grow"><div class="t">' + esc(inf.name) + '</div><div class="s">' + (sets.length ? esc(L.lastString(sets)) + ' kg' : '—') + '</div></div>' + tag + '</div>';
    }).join('');
    const ups = [];
    s.exercises.forEach((e) => {
      if (!L.loggedSets(e).length || !e.plan) return;
      const r = L.recommend(e.v, e.plan, ss, prog);
      if (r.trend === 'up') ups.push('<li><b>' + esc(info(e.v, prog).name) + '</b>: ' + r.loads.map(fmtW).join(' / ') + ' kg next time</li>');
    });
    const miss = (s.missing || []).map((m) => '<li>' + m.sets + ' × ' + esc(info(m.v, prog).name) + ' (' + esc(m.why) + ')</li>').join('');
    return '<section class="screen">' +
      '<header class="plan-head"><span class="plate lg k-' + s.kind + '">' + plateChar(s) + '</span><div class="grow"><p class="eyebrow">Saved</p><h1 class="h-display">' + esc(kindName(s)) + ' done</h1>' +
      '<p class="muted">' + L.fmtDate(s.date, true) + (mins != null ? ' · ' + mins + ' min' : '') + '</p></div></header>' +
      '<div class="stats"><div class="stat"><b>' + L.countSets(s) + '</b><span>sets logged</span></div><div class="stat"><b>' + (s.plannedSets || '—') + '</b><span>sets planned</span></div><div class="stat"><b>' + s.exercises.filter((e) => L.loggedSets(e).length).length + '</b><span>exercises</span></div></div>' +
      (ups.length ? '<section class="card"><h2 class="h3">Going up next time</h2><ul class="small" style="margin:8px 0 0;padding-left:20px">' + ups.join('') + '</ul></section>' : '') +
      (miss ? '<section class="card"><h2 class="h3">Not done today</h2><p class="small muted">Saved as not done. Nothing is carried over automatically.</p><ul class="small" style="margin:8px 0 0;padding-left:20px">' + miss + '</ul></section>' : '') +
      '<div class="list">' + rows + '</div>' +
      '<button class="btn primary xl" data-act="summary-done">Done</button></section>';
  }

  // ---------- History ----------
  function viewHistory() {
    const ss = L.liveSessions(sessions()).reverse();
    if (!ss.length) return '<section class="screen"><h1 class="h-display">History</h1><p class="muted">No workouts saved yet.</p></section>';
    const total = ss.reduce((n, s) => n + L.countSets(s), 0);
    let lastMonth = '';
    const items = ss.map((s) => {
      const d = L.parseISO(s.date);
      const m = d.toLocaleString('en-GB', { month: 'long', year: 'numeric' });
      const head = m !== lastMonth ? '<p class="month">' + m + '</p>' : '';
      lastMonth = m;
      return head + '<button class="item" data-act="open-session" data-id="' + esc(s.id) + '"><span class="plate sm k-' + (s.kind === 'A' || s.kind === 'B' ? s.kind : s.kind) + '">' + plateChar(s) + '</span>' +
        '<div class="grow"><div class="t">' + esc(kindName(s)) + '</div><div class="s">' + L.fmtDate(s.date) + ' · ' + L.countSets(s) + ' sets' + (s.imported ? ' · imported' : '') + '</div></div>' + statusTag(s) + '<span class="chev" aria-hidden="true">›</span></button>';
    }).join('');
    return '<section class="screen"><div><h1 class="h-display">History</h1><p class="muted">' + ss.length + ' sessions · ' + total + ' sets since ' + L.fmtDate(ss[ss.length - 1].date) + '</p></div>' +
      '<div class="list">' + items + '</div></section>';
  }

  function viewSession() {
    const s = store.docs['s-' + ui.historyId];
    if (!s || s.deleted) { ui.historyId = null; return viewHistory(); }
    const prog = program();
    const mins = s.finishedAt && s.startedAt ? Math.round((s.finishedAt - s.startedAt) / 60000) : null;
    const notes = (s.notes || []).map((n) => '<p class="note">' + esc(n) + '</p>').join('');
    const miss = (s.missing || []).map((m) => '<li>' + m.sets + ' × ' + esc(info(m.v, prog).name) + ' (' + esc(m.why) + ')</li>').join('');
    const omitted = (s.omitted || []).map((m) => '<li>' + m.sets + ' × ' + esc(info(m.v, prog).name) + ' (' + esc(m.why) + ')</li>').join('');
    const ex = s.exercises.map((e, k) => {
      const inf = info(e.v, prog);
      const sets = (e.sets || []).map((x, j) => x.r == null ? '' :
        '<button class="lset' + (x.orig ? ' edited' : '') + '" data-act="hedit-set" data-k="' + k + '" data-j="' + j + '"><span class="n">Set ' + (j + 1) + '</span><span class="v">' + fmtR(x.r) + ' × ' + fmtW(x.w) + ' kg</span>' +
        '<span class="x">' + (x.rir != null ? 'RIR ' + rirLabel(x.rir) : x.trir != null ? 'target RIR ' + x.trir : '') + '</span></button>').join('');
      const tag = e.status === 'skipped' ? '<span class="tag">Skipped</span>' : e.status === 'not done' ? '<span class="tag warn">Not done</span>' : e.status === 'partial' ? '<span class="tag warn">Fewer sets</span>' : '';
      return '<div class="ex-block card"><div class="ex-block-h"><div class="h3">' + esc(inf.name) + basisTag(inf.basis) + '</div>' + tag + '</div>' +
        (e.swappedFrom ? '<p class="small muted">Swapped from ' + esc(info(e.swappedFrom, prog).name) + '</p>' : '') +
        (e.loggedAs ? '<p class="small muted">Logged as: ' + esc(e.loggedAs) + '</p>' : '') +
        (e.note ? '<p class="small muted">' + esc(e.note) + '</p>' : '') +
        '<div class="logged">' + (sets || '<p class="small muted">No sets logged.</p>') + '</div></div>';
    }).join('');
    return '<section class="screen">' +
      '<button class="back" data-act="session-back">‹ History</button>' +
      '<header class="plan-head"><span class="plate lg k-' + s.kind + '">' + plateChar(s) + '</span><div class="grow"><h1 class="h2">' + esc(kindName(s)) + '</h1>' +
      '<p class="muted">' + L.fmtDate(s.date, true) + ' · ' + L.countSets(s) + (s.plannedSets ? ' of ' + s.plannedSets : '') + ' sets' + (mins != null ? ' · ' + mins + ' min' : '') + '</p></div>' + statusTag(s) + '</header>' +
      (s.imported ? '<p class="small muted">Imported from your ChatGPT handover. Actual RIR was never reported for these sets, so it stays empty.</p>' : '') +
      notes +
      (miss ? '<section class="card"><h2 class="h3">Not done</h2><ul class="small" style="margin:6px 0 0;padding-left:20px">' + miss + '</ul></section>' : '') +
      (omitted ? '<section class="card"><h2 class="h3">Moved to another day</h2><ul class="small" style="margin:6px 0 0;padding-left:20px">' + omitted + '</ul></section>' : '') +
      ex +
      '<p class="small muted">Tap any set to correct it. Corrections change that set; they never add a new one.</p>' +
      '<button class="btn danger block" data-act="delete-session">Delete this workout</button></section>';
  }

  // ---------- Exercises & program ----------
  function viewExercises() {
    const prog = program(); const ss = sessions();
    const dayBlock = (d) => {
      const rows = (prog.days[d] || []).map((p) => {
        const inf = info(p.v, prog);
        const r = L.recommend(p.v, p, ss, prog);
        const loads = r.loads.map((w) => (w == null ? '?' : fmtW(w))).join(' / ');
        return '<button class="item" data-act="open-ex" data-v="' + esc(p.v) + '"><div class="grow"><div class="t">' + esc(inf.name) + basisTag(inf.basis) + '</div>' +
          '<div class="s">' + p.sets + ' × ' + p.lo + '–' + p.hi + ' · next ' + loads + ' kg</div></div>' + trendTag(r.trend) + '<span class="chev" aria-hidden="true">›</span></button>';
      }).join('');
      const sets = (prog.days[d] || []).reduce((n, e) => n + e.sets, 0);
      return '<div class="ex-block-h"><h2 class="section-title">Workout ' + d + ' · ' + sets + ' sets</h2><button class="linkish" data-act="edit-day" data-kind="' + d + '">Edit</button></div><div class="list">' + rows + '</div>';
    };
    const inProg = new Set([].concat(prog.days.A || [], prog.days.B || []).map((p) => p.v));
    const others = L.allVariantIds(prog).filter((v) => !inProg.has(v)).map((v) => {
      const inf = info(v, prog); const ex = L.exposures(ss, v); const last = ex[ex.length - 1];
      return { v, inf, last };
    }).sort((a, b) => (b.last ? 1 : 0) - (a.last ? 1 : 0) || a.inf.name.localeCompare(b.inf.name));
    const otherRows = others.map((o) => '<button class="item" data-act="open-ex" data-v="' + esc(o.v) + '"><div class="grow"><div class="t">' + esc(o.inf.name) + basisTag(o.inf.basis) + '</div>' +
      '<div class="s">' + (o.last ? 'Last: ' + esc(L.lastString(o.last.sets)) + ' kg · ' + L.fmtDate(o.last.date) : 'No sets logged yet') + (o.inf.legacy ? ' · older split' : '') + '</div></div><span class="chev" aria-hidden="true">›</span></button>').join('');
    return '<section class="screen"><div><h1 class="h-display">Exercises</h1><p class="muted">Your A/B program with next weights. Tap an exercise for its history and settings.</p></div>' +
      dayBlock('A') + dayBlock('B') +
      '<h2 class="section-title">Alternatives &amp; others</h2><div class="list">' + otherRows + '</div></section>';
  }

  function spark(exps) {
    if (exps.length < 2) return '';
    const pts = exps.map((x) => ({ d: x.date, w: Math.max.apply(null, x.sets.map((s) => s.w || 0)) }));
    const W = 320, H = 96, px = 10, py = 18;
    const ws = pts.map((p) => p.w); const mn = Math.min.apply(null, ws), mx = Math.max.apply(null, ws);
    const X = (i) => px + (i * (W - 2 * px)) / (pts.length - 1);
    const Y = (w) => (mx === mn ? H / 2 : H - py - ((w - mn) / (mx - mn)) * (H - 2 * py));
    const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p.w).toFixed(1)).join('');
    const area = line + 'L' + X(pts.length - 1).toFixed(1) + ',' + (H - 4) + 'L' + X(0).toFixed(1) + ',' + (H - 4) + 'Z';
    const lastI = pts.length - 1;
    const iMax = ws.indexOf(mx);
    let labels = '<text x="' + X(lastI) + '" y="' + (Y(pts[lastI].w) - 9) + '" text-anchor="end">' + fmtW(pts[lastI].w) + ' kg</text>';
    if (iMax !== lastI && mx !== pts[lastI].w) labels += '<text x="' + X(iMax) + '" y="' + (Y(mx) - 9) + '" text-anchor="middle">' + fmtW(mx) + '</text>';
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + (H + 18) + '" role="img" aria-label="Heaviest set per session">' +
      '<line class="gd" x1="0" x2="' + W + '" y1="' + (H - 4) + '" y2="' + (H - 4) + '"/>' +
      '<path class="ar" d="' + area + '"/><path class="ln" d="' + line + '"/>' +
      pts.map((p, i) => '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.w).toFixed(1) + '" r="' + (i === lastI ? 4.5 : 3) + '"/>').join('') + labels +
      '<text x="' + px + '" y="' + (H + 14) + '">' + L.fmtDate(pts[0].d) + '</text><text x="' + (W - px) + '" y="' + (H + 14) + '" text-anchor="end">' + L.fmtDate(pts[lastI].d) + '</text></svg>';
  }

  function viewExercise() {
    const v = ui.exId; const prog = program(); const ss = sessions();
    const inf = info(v, prog);
    const exps = L.exposures(ss, v);

    }).join('');
    const histRows = exps.slice().reverse().map((x) => '<div class="lset"><span class="n">' + L.fmtDate(x.date) + '</span><span class="v">' + esc(L.lastString(x.sets)) + ' kg</span><span class="x">' + (x.kind === 'A' || x.kind === 'B' ? x.kind : x.kind === 'extra' ? 'Extra' : 'Older') + '</span></div>').join('');

      nextCards +
      '<div class="kv"><div class="stat"><b>' + (best ? fmtW(best.w) + '×' + fmtR(best.r) : '—') + '</b><span>heaviest set in your log' + (best ? ' · ' + L.fmtDate(best.date) : '') + '</span></div>' +
      '<div class="stat"><b>' + exps.length + '</b><span>sessions · ' + exps.reduce((n, x) => n + x.sets.length, 0) + ' sets</span></div></div>' +
      (exps.length > 1 ? '<section class="card"><p class="eyebrow" style="margin-bottom:6px">Heaviest set per session</p>' + spark(exps) + '</section>' : '') +
      (histRows ? '<section class="ex-block"><h2 class="h3">History</h2><div class="logged">' + histRows + '</div></section>' : '<p class="muted">No sets logged on this machine yet. Your first session sets its starting point.</p>') +
      '<form id="exform" class="card" style="display:grid;gap:12px" autocomplete="off"><h2 class="h3">Machine settings</h2>' +
      '<div class="field"><label for="ef-name">Name</label><input class="input" id="ef-name" value="' + esc(inf.name) + '"></div>' +
      '<div class="form-grid"><div class="field"><label for="ef-inc">Weight step (kg)</label><input class="input" id="ef-inc" inputmode="decimal" value="' + fmtW(inf.inc) + '"></div>' +
      '<div class="field"><label for="ef-rest">Rest (seconds)</label><input class="input" id="ef-rest" inputmode="numeric" value="' + (inf.rest || 105) + '"></div></div>' +
      '<div class="field"><label for="ef-basis">How the kg is counted</label><select class="input" id="ef-basis">' + basisOpts + '</select></div>' +
      '<div class="field"><label for="ef-setup">Setup notes</label><textarea class="input" id="ef-setup">' + esc(inf.setup || '') + '</textarea></div>' +
      '<p class="small muted">The weight step is the smallest jump this machine allows. It sets the − / + buttons and how much the weight goes up when you earn it.</p>' +
      '<button class="btn primary block" type="submit">Save settings</button></form></section>';
  }

  // ---------- Settings ----------

    const st = settings(); const prog = program();
    const themes = THEMES.map((t) => '<button class="theme" data-act="theme" data-theme="' + t[0] + '" aria-pressed="' + (st.theme === t[0]) + '" style="background:' + t[2] + ';color:' + t[4] + '">' +
      '<span class="sw">' + (t[0] === 'auto' ? '<i style="background:linear-gradient(90deg,#f0a93a 50%,#2350d8 50%)"></i>' : '<i style="background:' + t[3] + '"></i>') + '<b style="background:' + t[4] + '"></b></span>' +
      '<span class="nm">' + esc(t[1]) + '</span></button>').join('');

      synced: 'Saved to your Claude account (private to you) and on this phone. Changes sync automatically.',
      saving: 'Saving to your Claude account…',
      connecting: 'Connecting to your Claude account…',

    return '<section class="screen"><h1 class="h-display">Settings</h1>' +

      tog('beep', 'Beep when rest is over', 'Plays while the app is open. Phone volume must be on.') +
